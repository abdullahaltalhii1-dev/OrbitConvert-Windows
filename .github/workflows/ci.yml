name: CI

on:
    push:
        branches:
            - main
            - 'feature/**'
    pull_request:
        branches:
            - main

jobs:
    build-and-test:
        runs-on: windows-latest
        timeout-minutes: 45

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up .NET 10
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: 10.0.x

            # Pinned, owner-approved FFmpeg development build (size and SHA-256 verified by the script).
            # Real FFmpeg tests must run here: ORBITCONVERT_REQUIRE_FFMPEG makes them fail instead of skipping.
            - name: Fetch pinned FFmpeg for real video tests
              shell: pwsh
              run: |
                  $bin = ./tools/Get-FFmpeg.ps1 -Destination "$env:RUNNER_TEMP\orbitconvert-tools"
                  & "$bin\ffmpeg.exe" -hide_banner -version | Select-Object -First 1
                  "ORBITCONVERT_FFMPEG_DIR=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                  "ORBITCONVERT_REQUIRE_FFMPEG=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

            - name: Restore
              # Each engine is local to this job; required real tests must fail, not silently skip.
              run: dotnet restore OrbitConvert.slnx

            - name: Fetch pinned Pandoc for real document tests
              shell: pwsh
              run: |
                  $bin = ./tools/Get-Pandoc.ps1 -Destination "$env:RUNNER_TEMP\orbitconvert-tools"
                  "ORBITCONVERT_PANDOC_DIR=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                  "ORBITCONVERT_REQUIRE_PANDOC=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

            - name: Verify document engine
              shell: pwsh
              run: '& "$env:ORBITCONVERT_PANDOC_DIR\pandoc.exe" --version'

            - name: Build
              run: dotnet build OrbitConvert.slnx --configuration Release --no-restore

            - name: Test
              run: dotnet test OrbitConvert.slnx --configuration Release --no-build --blame-hang-timeout 10m --blame-hang-dump-type none
